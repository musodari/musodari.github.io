<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>390px 미리보기 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#d9d5cc}
  #frame{position:absolute;left:0;top:0;width:390px;height:100vh;border:0;background:#fff;display:block}
</style>
</head>
<body>
<iframe id="frame" src="./index.html"></iframe>
<script>
  var f = document.getElementById("frame");
  if (location.hash && location.hash.length > 1) f.src = "./index.html" + location.hash;
</script>
</body>
</html>
